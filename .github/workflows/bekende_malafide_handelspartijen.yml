---
# Retrieves the list of known malicious trading parties published by the Dutch National Police, converts the entries
# to AdGuard Home filter rules, and merges them into `filters/bekende_malafide_handelspartijen.txt`.
#
# The filter file is sorted and deduplicated after every run. When the content changed, the 'Last modified' header is
# updated and the change is proposed through a pull request (the default branch is protected by a ruleset, so a direct
# push is not possible). The commit is created through the GitHub API, which makes it signed and 'Verified'.
#
# Requirement: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

name: 🛡️ Update Bekende Malafide Handelspartijen

on:
  # Every 8 hours, at 00:00, 08:00, and 16:00 UTC.
  schedule:
    - cron: "0 */8 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (do not publish changes)"
        required: true
        default: false
        type: boolean
      verbose:
        description: "Enable verbose logging"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bekende-malafide-handelspartijen-${{ github.repository || github.run_id }}
  cancel-in-progress: false

jobs:
  update:
    name: 🛡️ Update filter list
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.actor, '[bot]')

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

      SOURCE_URL: "https://www.politie.nl/aangifte-of-melding-doen/bekende-malafide-handelspartijen.html"
      OUTPUT_FILE: filters/bekende_malafide_handelspartijen.txt
      UPDATE_BRANCH: chore/update-bekende-malafide-handelspartijen
      PR_TITLE: "chore(filter): update bekende malafide handelspartijen list"

      # The existing filter file is sorted with this locale; using another one would reorder the whole file.
      SORT_LOCALE: en_US.UTF-8
      TZ: Europe/Amsterdam

      DRY_RUN: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      VERBOSE: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verbose || 'false' }}

    steps:
      - name: 🏁 Notify start of process
        run: |
          echo "::notice title=Workflow started::🛡️ Update of the known malicious trading parties list initiated"
          echo "::group::ℹ️ Execution context"
          echo "Repository: $REPO"
          echo "Source: $SOURCE_URL"
          echo "Output file: $OUTPUT_FILE"
          echo "Dry run: $DRY_RUN"
          echo "Verbose: $VERBOSE"
          echo "::endgroup::"

      - name: 📦 Checkout repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Check dependencies
        run: |
          set -Eeuo pipefail

          echo "::group::🛠️ Checking dependencies"

          if ! command -v xmllint >/dev/null 2>&1; then
            echo "xmllint not found, installing libxml2-utils"
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxml2-utils
          fi

          for cmd in curl xmllint sed awk tr sort uniq grep jq gh base64; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "::error title=Missing dependency::❌ Required command not found: $cmd"
              exit 1
            fi
          done

          AVAILABLE_LOCALES="$(locale -a)"

          if ! grep -qiE '^en_US\.utf-?8$' <<<"$AVAILABLE_LOCALES"; then
            echo "Locale $SORT_LOCALE not found, generating it"
            sudo apt-get install -y -qq locales
            sudo locale-gen "$SORT_LOCALE"
          fi

          echo "✅ All dependencies are available"
          echo "::endgroup::"

      - name: 🌐 Fetch source page
        run: |
          set -Eeuo pipefail

          case "$SOURCE_URL" in
            https://*) ;;
            *)
              echo "::error title=Invalid URL::❌ The URL does not use https: $SOURCE_URL"
              exit 1
              ;;
          esac

          echo "::group::🌐 Fetching $SOURCE_URL"

          HTTP_STATUS="$(curl --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            --output "$RUNNER_TEMP/page.html" --write-out '%{http_code}' \
            "$SOURCE_URL")" || {
            echo "::error title=Download failed::❌ Failed to retrieve the webpage from $SOURCE_URL"
            exit 1
          }

          echo "HTTP status: $HTTP_STATUS"
          echo "::endgroup::"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error title=Unexpected HTTP status::❌ Received HTTP status $HTTP_STATUS from $SOURCE_URL"
            exit 1
          fi

      - name: 🔍 Extract URLs
        id: extract
        run: |
          set -Eeuo pipefail

          echo "::group::🔍 Extracting URLs"

          XPATH='//li[h3[@class="mb-2 text-lg font-bold mt-5 text-blue-600"'
          XPATH+=' and contains(text(), "URL")]]/following-sibling::li[not(h3)]/text()'

          {
            xmllint --html --xpath "$XPATH" "$RUNNER_TEMP/page.html" 2>/dev/null || true
          } |
            sed -e 's/^[[:space:]]*//' \
                -e 's/[[:space:]]*$//' \
                -e 's/\s*||/||/' \
                -e 's/\s*\^/\^/' \
                -e 's/\s*\$/\$/' \
                -e '/^$/d' |
            sed -e 's/.*/||&^/' |
            tr '[:upper:]' '[:lower:]' |
            sed '/@/d' >"$RUNNER_TEMP/extracted.txt"

          if [ ! -s "$RUNNER_TEMP/extracted.txt" ]; then
            echo "::endgroup::"
            echo "::error title=No URLs found::❌ No URLs found at $SOURCE_URL"
            exit 1
          fi

          EXTRACTED_COUNT="$(wc -l <"$RUNNER_TEMP/extracted.txt")"
          echo "count=$EXTRACTED_COUNT" >>"$GITHUB_OUTPUT"
          echo "✅ $EXTRACTED_COUNT URLs have been found"

          if [ "$VERBOSE" = "true" ]; then
            echo "Extracted entries:"
            cat "$RUNNER_TEMP/extracted.txt"
          fi

          echo "::endgroup::"

      - name: 🔄 Merge, sort and deduplicate entries
        id: process
        run: |
          set -Eeuo pipefail

          echo "::group::🔄 Processing the filter file"

          BEFORE_FILE="$RUNNER_TEMP/before.txt"
          WORK_FILE="$RUNNER_TEMP/work.txt"
          SORTED_FILE="$RUNNER_TEMP/sorted.txt"

          cp "$OUTPUT_FILE" "$BEFORE_FILE"

          # Append the extracted URLs to the current filter file
          # (the blank line guards against a missing final newline).
          {
            cat "$BEFORE_FILE"
            echo
            cat "$RUNNER_TEMP/extracted.txt"
          } >"$WORK_FILE"

          {
            # 1. Comment lines (`#` or `!`) go to the top of the file
            awk '/^#|^!/' "$WORK_FILE"

            # 2. Lines starting with `*`, sorted and deduplicated
            awk '/^\*/' "$WORK_FILE" | LC_ALL="$SORT_LOCALE" sort | uniq

            # 3. Lines starting with `||` followed by a digit, sorted and deduplicated
            awk '/^\|\|[0-9]/' "$WORK_FILE" | LC_ALL="$SORT_LOCALE" sort | uniq

            # 4. Lines starting with `||` followed by a letter, sorted and deduplicated
            awk '/^\|\|[a-z]/' "$WORK_FILE" | LC_ALL="$SORT_LOCALE" sort | uniq
          } >"$SORTED_FILE"

          if cmp -s "$BEFORE_FILE" "$SORTED_FILE"; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "ℹ️ No changes detected in the file. Timestamp not updated."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            cp "$SORTED_FILE" "$OUTPUT_FILE"

            TIMESTAMP="$(date '+! Last modified: %Y-%m-%dT%H:%M:%S%:z')"
            sed -i "s/^! Last modified: .*/$TIMESTAMP/" "$OUTPUT_FILE"

            echo "ℹ️ File content has changed. Timestamp updated."
          fi

          ADDED_COUNT="$(grep -Fxvf "$BEFORE_FILE" "$SORTED_FILE" | grep -c '^||' || true)"
          TOTAL_COUNT="$(grep -cE '^(\|\||\*)' "$OUTPUT_FILE" || true)"

          echo "added=$ADDED_COUNT" >>"$GITHUB_OUTPUT"
          echo "total=$TOTAL_COUNT" >>"$GITHUB_OUTPUT"

          echo "New entries: $ADDED_COUNT"
          echo "Total entries: $TOTAL_COUNT"

          if [ "$VERBOSE" = "true" ]; then
            echo "Changes:"
            git --no-pager diff --no-color --stat -- "$OUTPUT_FILE" || true
            git --no-pager diff --no-color -U0 -- "$OUTPUT_FILE" | head -n 500 || true
          fi

          echo "::endgroup::"

      - name: 🚀 Publish changes through a pull request
        id: publish
        if: steps.process.outputs.changed == 'true'
        env:
          ADDED_COUNT: ${{ steps.process.outputs.added }}
          TOTAL_COUNT: ${{ steps.process.outputs.total }}
        run: |
          set -Eeuo pipefail

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice title=Dry run::ℹ️ Dry run enabled, the changes are not published"
            echo "result=dry-run" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_BRANCH="$(gh api "repos/$REPO" --jq '.default_branch')"

          if [ "$GITHUB_REF_NAME" != "$BASE_BRANCH" ]; then
            echo "::warning title=Not on default branch::⚠️ Changes are only published from '$BASE_BRANCH'" \
              "(current: '$GITHUB_REF_NAME')"
            echo "result=skipped" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::🚀 Preparing branch $UPDATE_BRANCH"

          # The blob SHA of the current file makes the update fail instead of overwriting a concurrent change.
          FILE_SHA="$(git rev-parse "HEAD:$OUTPUT_FILE")"

          if gh api "repos/$REPO/git/ref/heads/$UPDATE_BRANCH" >/dev/null 2>&1; then
            echo "Resetting existing branch to $GITHUB_SHA"
            gh api --method PATCH "repos/$REPO/git/refs/heads/$UPDATE_BRANCH" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            echo "Creating branch from $GITHUB_SHA"
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/heads/$UPDATE_BRANCH" -f sha="$GITHUB_SHA" >/dev/null
          fi

          echo "::endgroup::"
          echo "::group::✍️ Creating verified commit"

          base64 --wrap=0 "$OUTPUT_FILE" >"$RUNNER_TEMP/content.b64"

          jq -n \
            --arg message "$PR_TITLE" \
            --arg branch "$UPDATE_BRANCH" \
            --arg sha "$FILE_SHA" \
            --rawfile content "$RUNNER_TEMP/content.b64" \
            '{message: $message, branch: $branch, sha: $sha, content: $content}' >"$RUNNER_TEMP/payload.json"

          COMMIT_SHA="$(gh api --method PUT "repos/$REPO/contents/$OUTPUT_FILE" \
            --input "$RUNNER_TEMP/payload.json" --jq '.commit.sha')"

          echo "Commit: $COMMIT_SHA"
          echo "commit_sha=$COMMIT_SHA" >>"$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::🔀 Creating or updating pull request"

          cat <<EOF >"$RUNNER_TEMP/pr_body.md"
          ## 🛡️ Automated filter update

          This pull request was generated by the **Update Bekende Malafide Handelspartijen** workflow.

          - **Source:** $SOURCE_URL
          - **New entries:** $ADDED_COUNT
          - **Total entries:** $TOTAL_COUNT
          - **Workflow run:** [View Details]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID)
          EOF

          OWNER="${REPO%%/*}"
          PR_NUMBER="$(gh api "repos/$REPO/pulls?state=open&base=$BASE_BRANCH&head=$OWNER:$UPDATE_BRANCH" \
            --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            if ! PR_URL="$(gh api --method POST "repos/$REPO/pulls" \
              -f title="$PR_TITLE" -f head="$UPDATE_BRANCH" -f base="$BASE_BRANCH" \
              -F body=@"$RUNNER_TEMP/pr_body.md" --jq '.html_url')"; then
              echo "::endgroup::"
              echo "::error title=Pull request failed::❌ Could not create the pull request." \
                "Enable 'Allow GitHub Actions to create and approve pull requests'" \
                "in the repository Actions settings, or open a pull request from '$UPDATE_BRANCH' manually."
              exit 1
            fi
            echo "Created pull request: $PR_URL"
          else
            gh api --method PATCH "repos/$REPO/pulls/$PR_NUMBER" \
              -F body=@"$RUNNER_TEMP/pr_body.md" >/dev/null
            PR_URL="$GITHUB_SERVER_URL/$REPO/pull/$PR_NUMBER"
            echo "Updated pull request: $PR_URL"
          fi

          echo "pr_url=$PR_URL" >>"$GITHUB_OUTPUT"
          echo "result=published" >>"$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: 📊 Generate job summary
        if: always()
        run: |
          echo "::group::📊 Generating Summary Report"

          OVERALL_STATUS="${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}"
          PROCESS_STATUS="${{ steps.process.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          PUBLISH_RESULT="${{ steps.publish.outputs.result || 'not required' }}"

          cat <<EOF >>"$GITHUB_STEP_SUMMARY"
          ## 🛡️ Bekende Malafide Handelspartijen Summary

          Execution completed at: $(date -u)
          Overall Status: $OVERALL_STATUS

          ### 📈 Execution Results

          | Task | Result |
          | :--- | :--- |
          | 🔍 Extracted URLs | ${{ steps.extract.outputs.count || 0 }} |
          | 🔄 Processing | $PROCESS_STATUS |
          | ➕ New entries | ${{ steps.process.outputs.added || 0 }} |
          | 📚 Total entries | ${{ steps.process.outputs.total || 0 }} |
          | 🚀 Publication | $PUBLISH_RESULT |

          ### ⚙️ Runtime Configuration

          - **Dry Run Mode:** \`${DRY_RUN}\`
          - **Verbose Mode:** \`${VERBOSE}\`
          - **Source:** $SOURCE_URL
          - **Output File:** \`$OUTPUT_FILE\`

          ### 🧩 Context

          - **Repository:** $REPO
          - **Pull Request:** ${{ steps.publish.outputs.pr_url || 'none' }}
          - **Workflow Run:** [View Details]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID)
          EOF

          echo "::endgroup::"
